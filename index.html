<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NFL Standings"><title>NFL Standings</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f7f9fc;background:#0b1220;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 16px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;margin:0}p{color:#9daec5}button{font:inherit;cursor:pointer}.refresh{background:#223653;color:white;border:1px solid #456184;border-radius:12px;padding:10px 13px}.meta{font-size:13px;margin:12px 0 20px}.head,.team{display:grid;grid-template-columns:30px 1fr 80px 24px;gap:9px;align-items:center}.head{font-size:12px;color:#9daec5;padding:8px 12px}.entry{border:1px solid #25334a;border-radius:14px;margin:7px 0;overflow:hidden;background:#151f30}.team{width:100%;padding:13px 12px;background:transparent;border:0;color:inherit;text-align:left}.rank{color:#9daec5}.identity{display:flex;gap:10px;align-items:center;min-width:0}.identity img{width:34px;height:34px;object-fit:contain}.name{font-size:14px;font-weight:650}.sub{font-size:11px;color:#9daec5;margin-top:2px}.record{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.pct{font-size:11px;color:#9daec5;font-weight:400}.arrow{text-align:right;color:#9daec5}.games{padding:0 14px 12px 51px;border-top:1px solid #25334a}.game{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #25334a;font-size:13px}.game:last-child{border:0}.result{font-weight:750;white-space:nowrap}.W{color:#75e0a2}.L{color:#ff9292}.T{color:#ffda84}.error{color:#ffaaaa}.empty{padding:16px;color:#9daec5;font-size:13px}.spin{opacity:.55}footer{font-size:12px;color:#8394ac;margin-top:22px;line-height:1.5}</style></head><body><main><header><div><h1>NFL Standings</h1><p id="season" style="margin:5px 0 0">Regular season only</p></div><button class="refresh" id="refresh">↻ Refresh</button></header><p class="meta" id="status" role="status">Loading latest results…</p><div class="head"><span>#</span><span>TEAM</span><span style="text-align:right">W-L-T</span><span></span></div><div id="list"></div><footer>Sorted by winning percentage (ties count as half a win), then wins, point differential and team name. Completed regular-season games only. ESPN data is unofficial and may be delayed.</footer></main><script>
const BASE='https://site.api.espn.com/apis/site/v2/sports/football/nfl';const list=document.querySelector('#list'),status=document.querySelector('#status'),refresh=document.querySelector('#refresh');let busy=false,expanded=new Set(),lastSuccess=null;function year(){const d=new Date(),y=d.getFullYear();return d.getMonth()<2?y-1:y}const season=year();document.querySelector('#season').textContent=`${season} Regular Season`;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});const time=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){if(busy)return;busy=true;refresh.disabled=true;refresh.classList.add('spin');status.textContent='Checking ESPN for the latest results…';try{const [teamsResponse,...weeks]=await Promise.all([json(`${BASE}/teams?limit=40`),...Array.from({length:18},(_,i)=>json(`${BASE}/scoreboard?season=${season}&seasontype=2&week=${i+1}&limit=30`))]);const rawTeams=teamsResponse.sports?.[0]?.leagues?.[0]?.teams||[];if(rawTeams.length<32)throw Error('Could not retrieve all 32 teams');const teams=new Map(rawTeams.map(x=>{const t=x.team;return[String(t.id),{id:String(t.id),name:t.displayName,short:t.shortDisplayName,logo:t.logos?.[0]?.href||'',w:0,l:0,t:0,pf:0,pa:0,games:[]}]}));const events=new Map();for(const week of weeks)for(const e of week.events||[])if(e.season?.type===2||(!e.season?.type&&e.week?.number)){events.set(e.id,e)}for(const e of events.values()){if(!e.status?.type?.completed)continue;const competitors=e.competitions?.[0]?.competitors||[];if(competitors.length!==2)continue;const [a,b]=competitors;if(!teams.has(String(a.id))||!teams.has(String(b.id)))continue;const sa=Number(a.score),sb=Number(b.score);if(!Number.isFinite(sa)||!Number.isFinite(sb))continue;for(const [me,other,myScore,otherScore] of [[a,b,sa,sb],[b,a,sb,sa]]){const t=teams.get(String(me.id)),result=myScore>otherScore?'W':myScore<otherScore?'L':'T';t[result.toLowerCase()]++;t.pf+=myScore;t.pa+=otherScore;t.games.push({date:e.date,opponent:other.team?.displayName||'Opponent',away:me.homeAway==='away',myScore,otherScore,result,week:e.week?.number})}}const ordered=[...teams.values()].map(t=>({...t,pct:t.w+t.l+t.t?(t.w+t.t/2)/(t.w+t.l+t.t):0})).sort((a,b)=>b.pct-a.pct||b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa)||a.name.localeCompare(b.name));list.innerHTML=ordered.map((t,i)=>{const open=expanded.has(t.id);const games=t.games.sort((a,b)=>new Date(b.date)-new Date(a.date));return `<section class="entry"><button class="team" data-id="${safe(t.id)}" aria-expanded="${open}"><span class="rank">${i+1}</span><span class="identity"><img src="${safe(t.logo)}" alt="" loading="lazy"><span><span class="name">${safe(t.name)}</span><span class="sub">${(t.pct*100).toFixed(1)}% · PD ${t.pf-t.pa>0?'+':''}${t.pf-t.pa}</span></span></span><span class="record">${t.w}-${t.l}-${t.t}</span><span class="arrow">${open?'⌃':'⌄'}</span></button>${open?`<div class="games">${games.length?games.map(g=>`<div class="game"><span>${fmt(g.date)} · <strong>${g.away?'AWAY':'HOME'}</strong> · ${g.away?'@':'vs'} ${safe(g.opponent)}</span><span class="result ${g.result}">${g.result} ${g.myScore}-${g.otherScore}</span></div>`).join(''):'<div class="empty">No completed regular-season games yet.</div>'}</div>`:''}</section>`}).join('');lastSuccess=new Date();status.textContent=`Updated ${time()} · ${events.size} scheduled games checked · Auto-refresh every 15 sec`;window.currentTeams=ordered}catch(err){status.innerHTML=`<span class="error">Unable to refresh: ${safe(err.message)}.</span> ${lastSuccess?'Showing previously loaded results.':'Check your connection and try again.'}`}finally{busy=false;refresh.disabled=false;refresh.classList.remove('spin')}}
list.addEventListener('click',e=>{const btn=e.target.closest('button[data-id]');if(!btn)return;const id=btn.dataset.id;expanded.has(id)?expanded.delete(id):expanded.add(id);const t=window.currentTeams;if(t){const scroll=window.scrollY;renderCached(t);window.scrollTo(0,scroll)}});function renderCached(t){/* Reuse last downloaded data without another network request. */const saved=window.currentTeams;window.currentTeams=null;const sections=[...list.querySelectorAll('.entry')];for(let i=0;i<sections.length;i++){const team=t[i],section=sections[i],open=expanded.has(team.id);section.querySelector('.team').setAttribute('aria-expanded',String(open));section.querySelector('.arrow').textContent=open?'⌃':'⌄';section.querySelector('.games')?.remove();if(open){const div=document.createElement('div');div.className='games';div.innerHTML=team.games.length?team.games.map(g=>`<div class="game"><span>${fmt(g.date)} · <strong>${g.away?'AWAY':'HOME'}</strong> · ${g.away?'@':'vs'} ${safe(g.opponent)}</span><span class="result ${g.result}">${g.result} ${g.myScore}-${g.otherScore}</span></div>`).join(''):'<div class="empty">No completed regular-season games yet.</div>';section.append(div)}}window.currentTeams=saved}
refresh.addEventListener('click',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},15000);load();
</script></body></html>
